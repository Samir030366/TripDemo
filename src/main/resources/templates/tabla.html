<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Trips</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<img th:src="@{/images/logo.png}" width="136" height="136">
        <h1>Trips en El Salvador</h1>

        <table class="table table-hover">
                <tr>
                	<th>Foto</th>
                    <th>id</th>
                    <th>nombre</th>
                    <th>Fecha publicacion</th>
                    <th>Costo</th>
                    <th>Descripcion</th>
                    <th>Destacado</th>
                    <th>Calificación</th>
                    <th>Detalle</th>
                    <th>Eliminar</th>
                </tr>
                <tr th:each="trip : ${trips}">
                  <td>
                      <img th:src="@{/images/{img} (img=${trip.imagen})}" width="100" height="100">
                    <td th:text="${trip.id}"></td>
                    <td th:text="${trip.nombre}"></td>
                    <td th:text="${trip.fecha}"></td>
                    <td th:text="${trip.costo}"></td>
                    <td th:text="${trip.descripcion}"></td>
                    <td>
                        <!-- <td th:text="${trip.destacado == 1? 'Si' : 'No' }"></td> -->
                        <span th:if="${trip.destacado}" class="badge bg-success">Si</span>
                        <span th:unless="${trip.destacado}" class="badge bg-danger">No</span>
                    </td>
                    <td>  <!-- Nueva columna con color -->
                        <span th:if="${trip.calificacion >= 6}" class="badge bg-success" th:text="${trip.calificacion}"></span>
                        <span th:unless="${trip.calificacion >= 6}" class="badge bg-danger" th:text="${trip.calificacion}"></span>
                    </td>
                    <td>
                    	<a th:href="@{/trips/view/{id} (id=${trip.id}) }" class="btn btn-success" >Detalle</a>
                    </td>
                     <td>
                     	<a th:href="@{/trips/delete/{id} (id=${trip.id})}" class="btn btn-danger">Eliminar</a>
                    </td>
                </tr>
        </table>

    <!-- Bootstrap JS (opcional pero recomendado) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
