<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Categorias</title>
<!-- Primera imagen (líneas 11-20) -->
<!-- Bootstrap core CSS -->
<link th:href="@{/bootstrap/css/bootstrap.min.css}" rel="stylesheet">
<!-- Custom styles for this template -->
<link th:href="@{/bootstrap/css/jumbotron.css}" rel="stylesheet">
<link th:href="@{/bootstrap/css/sticky-footer-navbar.css}" rel="stylesheet">
<link href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" rel="stylesheet">
</head>
<body>
<header th:insert="fragments/menu :: menu-principal"></header>
<main role="main">
	<h2>Lista Categoria</h2>
<div class="card-body">
    <a class="btn btn-primary" th:href="@{/categorias/create}" role="button">
        <i class="fas fa-file" aria-hidden="true"></i> Nueva
    </a>
    
    <hr>
    <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}" role="alert"></div>
    <table class="table table-hover">
        <thead class="thead-light">
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
                <th scope="col">Operaciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categorias}">
                <th scope="row" th:text="${cat.id}"></th>
                <td th:text="${cat.nombre}"></td>
                <td th:text="${cat.descripcion}"></td>
                <td>
                    <!-- Botón Editar -->
                    <a href="#" 
                       class="btn btn-success btn-sm" 
                       role="button" 
                       title="Editar">
                        <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                    </a>
                    
                    <!-- Botón Eliminar -->
                    <a href="#" 
                       onclick="return confirm('¿Estas seguro?')" 
                       class="btn btn-success btn-sm" 
                       role="button" 
                       title="Eliminar">
                        <i class="fas fa-trash-alt" aria-hidden="true"></i>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<!-- Segunda imagen (líneas 53-60) -->
</main>
<footer th:insert="fragments/footer :: pie-pagina" class="footer"></footer>

<!-- Bootstrap core JavaScript
================================================== -->
<!-- Placed at the end of the document so the pages load faster -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script th:src="@{/bootstrap/js/bootstrap.min.js}"></script>

</body>
</body>
</html>
